services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      FINANCE_DATABASE_PATH: /data/database/finance.duckdb
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"
    restart: unless-stopped

